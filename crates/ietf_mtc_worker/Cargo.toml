[package]
name = "ietf_mtc_worker"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "An implementation of a Merkle Tree Certificates CA on Cloudflare Workers"
categories = ["cryptography"]
keywords = ["certificate", "transparency", "crypto", "pki"]

[package.metadata.release]
release = false

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true

[lib]
crate-type = ["cdylib"]

[build-dependencies]
config = { path = "./config", package = "ietf_mtc_worker_config" }
generic_log_worker.workspace = true
jsonschema.workspace = true
ietf_mtc_api.workspace = true
serde_json.workspace = true
serde.workspace = true
url.workspace = true
x509-cert.workspace = true
der.workspace = true
ml-dsa.workspace = true
pkcs8.workspace = true
signed_note.workspace = true

[dependencies]
axum.workspace = true
config = { path = "./config", package = "ietf_mtc_worker_config" }
der.workspace = true
generic_log_worker.workspace = true
ed25519-dalek.workspace = true
getrandom_03.workspace = true
ml-dsa.workspace = true
pkcs8.workspace = true
getrandom.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
signed_note.workspace = true
tlog_checkpoint.workspace = true
tlog_core.workspace = true
tlog_entry.workspace = true
tower-service.workspace = true
worker = { workspace = true, features = ["http", "axum"] }
x509-cert.workspace = true
ietf_mtc_api.workspace = true
tlog_cosignature.workspace = true
tlog_mirror.workspace = true
tlog_witness.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(wasm_bindgen_unstable_test_coverage)',
] }

[package.metadata.cargo-machete]
ignored = ["getrandom"]

[dev-dependencies]
futures-executor.workspace = true
