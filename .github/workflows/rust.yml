name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_slow_checks:
        description: "Run the checks excluded from the default test run"
        type: boolean
        default: true
      fuzz_seconds:
        description: "Seconds to run each fuzz target for"
        type: string
        default: "60"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Clippy (required)
        run: cargo clippy -- -D warnings
      - name: Clippy (pedantic, advisory)
        run: cargo clippy --workspace --all-targets -- -Dwarnings -Dclippy::pedantic
        continue-on-error: true
      - name: Unused dependencies (advisory)
        run: cargo install cargo-shear --quiet && cargo shear
        continue-on-error: true
      - name: Formatting (advisory)
        run: cargo fmt --all --check
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Build
        run: cargo build --tests --workspace --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Run tests
        run: cargo test --verbose

  # Checks the default `cargo test` run skips: `#[ignore]`d tests and the
  # cargo-fuzz targets, which need a nightly toolchain.
  slow-checks:
    name: Slow Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_slow_checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # Covers the MTC Appendix C.2 vectors and the long-running sequencer
      # tests. `integration_tests` is excluded because it needs a live
      # wrangler dev instance; the Integration Tests workflow runs it.
      - name: Ignored tests
        run: cargo test --workspace --exclude integration_tests -- --ignored
      - name: Install nightly toolchain
        run: rustup toolchain install nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz parse_tile_path
        run: cargo +nightly fuzz run fuzz_parse_tile_path -- -max_total_time=${{ inputs.fuzz_seconds }}
      - name: Fuzz parse_checkpoint
        run: cargo +nightly fuzz run fuzz_parse_checkpoint -- -max_total_time=${{ inputs.fuzz_seconds }}
