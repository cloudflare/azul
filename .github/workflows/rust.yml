name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_large_mtc_vectors:
        description: "Run the MTC Appendix C.2 large subtree vectors"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Clippy (required)
        run: cargo clippy -- -D warnings
      - name: Clippy (pedantic, advisory)
        run: cargo clippy --workspace --all-targets -- -Dwarnings -Dclippy::pedantic
        continue-on-error: true
      - name: Unused dependencies (advisory)
        run: cargo install cargo-shear --quiet && cargo shear
        continue-on-error: true
      - name: Formatting (advisory)
        run: cargo fmt --all --check
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Build
        run: cargo build --tests --workspace --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Run tests
        run: cargo test --verbose

  large-mtc-vectors:
    name: Large MTC Vectors
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_large_mtc_vectors
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Run Appendix C.2 vectors
        run: cargo test -p tlog_core --test large_vectors -- --ignored
